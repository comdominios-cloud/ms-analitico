# Desarrollo local.
#   docker compose up --build
services:
  api:
    build: .
    container_name: ms-analitico
    ports:
      - "9005:8005"
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./queries:/app/queries
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload
